# Bootstrap only: serve HTTP while obtaining the first certificate.
server {
    listen 80;
    server_name dankecxmj.guaguahub.cn;
    root /var/www/tidemyst-haven/current;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/tidemyst-haven/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
