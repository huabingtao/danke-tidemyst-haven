server {
    listen 80;
    server_name dankecxmj.guaguahub.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/tidemyst-haven/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://dankecxmj.guaguahub.cn$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name dankecxmj.guaguahub.cn;
    root /var/www/tidemyst-haven/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/dankecxmj.guaguahub.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dankecxmj.guaguahub.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm;

    location ^~ /api/stats {
        client_max_body_size 2k;
        proxy_pass http://127.0.0.1:3009;
        proxy_set_header Host $host;
        proxy_read_timeout 5s;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ^~ /ocr/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }
    location ~* \.(?:js|mjs|css|wasm|json|png|jpg|jpeg|svg|ico|woff2?)$ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
